function offerRelics(done=completeNode,legend=false,rare=false){let pool=relics.filter(r=>r.legend===legend&&!has(r.id));if(rare&&!legend){const rarePool=pool.filter(r=>r.rare);if(rarePool.length>=3)pool=rarePool}const out=[];while(pool.length&&out.length<3){const i=Math.floor(rand(0,pool.length)),r=pool.splice(i,1)[0];out.push({...r,foot:r.category,apply:()=>{p.relics.push(r.id);if(r.id==='overdrive'){p.fire*=1.25;p.crit=Math.min(.7,p.crit+.1)}if(r.id==='aegis'){p.maxHp+=40;p.hp=Math.min(p.maxHp,p.hp+40)}notify('获得遗物：'+r.name)}})}if(!out.length){coins+=35;notify('遗物已收集完毕 · 转化为 35 金币');done();return}offer(legend?'选择传奇遗物':'发现遗物',legend?'这是足以改变下一场战斗的力量。':'不同遗物可以组合生效；查看描述寻找武器协同。',out,done,legend)}
function offerWeapon(done=completeNode){let ids=Object.keys(weapons).filter(id=>!p.inventory.includes(id));if(!ids.length){coins+=30;notify('武器已集齐 · +30 金币');done();return}ids=ids.sort(()=>Math.random()-.5).slice(0,3);offer('选择新武器','获得后立即装备；Q 或触屏换枪按钮随时切换。',ids.map(id=>({name:weapons[id].name,desc:weapons[id].tag,symbol:weapons[id].symbol,foot:'加入武器栏',apply:()=>{p.inventory.push(id);p.weapon=id;p.charge=0}})),done)}
function finishCombat(){if(state!=='combat'||node.combatDone||p.hp<=0)return;node.combatDone=true;shots=[];updateDrops(0,true);if(has('ward')||has('aegis'))p.shield=Math.min(60,p.shield+(has('ward')?18:0)+(has('aegis')?20:0));coins+=8+node.risk*3;sound(800,.2);if(node.type==='boss'){offerRelics(completeNode,true);return}if(node.type==='elite'){offerRelics(completeNode,false,true);return}if(node.type==='survival'){offerRelics(()=>offerWeapon());return}
 const pool=baseUpgrades.filter(u=>u.id!=='crit'||p.crit<.7).map(u=>({...u,apply:()=>{u.apply(p);p.upgrades.push(u.name)}}));for(const id of p.inventory)if(!p.mods.includes(id)){const [name,desc]=uniqueMods[id];pool.push({name,desc,rare:true,apply:()=>{p.mods.push(id);if(id==='smg')p.crit=Math.min(.7,p.crit+.12);p.upgrades.push(name)}})}const selected=[];while(pool.length&&selected.length<3)selected.push(pool.splice(Math.floor(rand(0,pool.length)),1)[0]);offer('战斗完成 · 选择强化',`已收集房间掉落。当前金币 ${coins}，生命 ${Math.ceil(p.hp)}/${p.maxHp}。`,selected,completeNode)}
function createShop(){const discount=has('discount')?.75:1;shopStock=[{name:'医疗组件',desc:'回复 45 生命。',cost:Math.ceil(22*discount),symbol:'+',apply:()=>p.hp=Math.min(p.maxHp,p.hp+45)},{name:'武器箱',desc:'三选一获得尚未持有的武器。',cost:Math.ceil(38*discount),symbol:'⌁',apply:()=>offerWeapon(()=>changeState('shop'))},{name:'遗物终端',desc:'三选一获得一件遗物。',cost:Math.ceil(48*discount),symbol:'◇',rare:true,apply:()=>offerRelics(()=>changeState('shop'),false,node.risk>2)}]}
function pickOption(i){if(performance.now()<inputBlockedUntil||!options[i]||options[i].disabled)return;sound(600,.05);if(state==='loadout'){pilot=i;renderScreen();return}if(state==='map'){enterNode(i);return}if(state==='reward'){const o=rewardOptions[i],done=afterReward;afterReward=null;rewardOptions=[];o.apply();done?.();return}if(state==='shop'){const o=shopStock[i];if(o.sold||coins<o.cost)return;o.sold=true;coins-=o.cost;o.apply();if(state==='shop')renderScreen();return}if(state==='chest'){coins+=25;if(has('fortune')){coins+=20;offerRelics(()=>offerWeapon())}else offerRelics();return}if(state==='rest'){if(i===0){p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.45);p.shield=Math.min(40,p.shield+10);completeNode()}else offerWeapon();return}if(state==='event'){if(i===0){coins+=20;p.hp=Math.min(p.maxHp,p.hp+18);completeNode()}else if(i===1){p.hp=Math.max(1,p.hp-18);coins+=60;offerWeapon()}else{p.maxHp-=12;p.hp=Math.min(p.hp,p.maxHp);offerRelics(completeNode,false,true)}}}

// 所有战斗帧先重置变换、透明度并清屏，HUD 使用独立 DOM，不与地图/战斗共享像素。
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function circle(x,y,r,color,stroke=false){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(stroke){ctx.strokeStyle=color;ctx.stroke()}else{ctx.fillStyle=color;ctx.fill()}}
function pixelUnit(e,player=false){const x=Math.round(e.x),y=Math.round(e.y),r=e.r,c=player?'#72f5cf':e.color;rect(x-r,y+r-1,r*2,5,'#060c17');if(e.type==='turret'){rect(x-r-3,y-r+5,r*2+6,r*2-3,'#162639');rect(x-r,y-r,r*2,r*2,c);circle(x,y,6,'#132231');return}if(e.boss){circle(x,y,r+6,c,true);rect(x-r,y-r,r*2,r*2,'#0b1420');rect(x-r+3,y-r+3,r*2-6,r*2-6,c);rect(x-r+6,y-9,r*2-12,13,'#16273b');rect(x-9,y-5,5,4,'#eafff7');rect(x+4,y-5,5,4,'#eafff7');return}rect(x-r,y-r,r*2,r*2,'#081722');rect(x-r+2,y-r+2,r*2-4,r*2-4,c);rect(x-r+4,y-r+6,r*2-8,6,'#173448');rect(x-r+4,y-r+6,r*2-8,2,'#e8ffff');rect(x-r+3,y+r-1,5,5,'#28464f');rect(x+r-8,y+r-1,5,5,'#28464f');if(e.type==='summoner'){circle(x,y,r+5,c,true)}if(e.type==='tank'){rect(x-r-3,y-4,5,15,'#bb566b');rect(x+r-2,y-4,5,15,'#bb566b')}}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';rect(0,0,W,H,'#090f1a');if(!p||!walls.length)return;
 ctx.save();ctx.translate(shake?rand(-shake,shake):0,shake?rand(-shake,shake):0);const z=zones[zone];rect(30,30,900,480,z.floor);ctx.lineWidth=1;
 for(let y=1;y<17;y++)for(let x=1;x<31;x++){if((x+y)%2===0)rect(x*T,y*T,T,T,z.grid+'38');rect(x*T+14,y*T+14,1,1,z.grid)}
 for(let y=0;y<18;y++)for(let x=0;x<32;x++)if(wallAt(x,y)){rect(x*T,y*T,T,T,'#08101a');rect(x*T+2,y*T+2,T-4,T-4,z.wall);rect(x*T+3,y*T+3,T-6,3,'#b8e2e321');rect(x*T+3,y*T+T-7,T-6,4,'#030d1955')}
 circle(105,405,23,'#72f5cf44',true);rect(98,404,14,2,'#72f5cf');rect(104,398,2,14,'#72f5cf');
 for(const h of hazards){const warn=h.phase==='warn',active=h.phase==='fire';ctx.globalAlpha=active?.8:warn?.28+.18*Math.sin(clock*18):.1;const col=warn?'#ffc276':z.color;if(h.type==='laser'){rect(32,h.y-(active?5:2),896,active?10:4,col);if(warn){ctx.fillStyle='#ffd29a';ctx.font='10px sans-serif';ctx.fillText('⚠ 激光预警',410,h.y-15)}}else{circle(h.x,h.y,h.r,col,(!active));if(warn)circle(h.x,h.y,h.r*(1-h.time/1.2),col,true)}ctx.globalAlpha=1}
 for(const d of drops){rect(d.x-5,d.y-5,10,10,'#071a20');if(d.type==='coin'){rect(d.x-3,d.y-4,6,8,'#ffd085');rect(d.x,d.y-2,1,4,'#775838')}else{rect(d.x-2,d.y-5,4,10,'#9bffd3');rect(d.x-5,d.y-2,10,4,'#9bffd3')}}
 for(const t of trails){ctx.globalAlpha=t.t/1.8;ctx.lineWidth=8;ctx.strokeStyle='#89ebda';ctx.beginPath();ctx.moveTo(t.a.x,t.a.y);ctx.lineTo(t.b.x,t.b.y);ctx.stroke();ctx.globalAlpha=1}
 for(const e of enemies){if(e.dead)continue;if(e.spawn>0){ctx.lineWidth=2;circle(e.x,e.y,e.r+8+e.spawn*15,'#ff98a5',true);continue}pixelUnit(e);if(e.windup>0){ctx.lineWidth=2;circle(e.x,e.y,e.r+11,'#ffca91',true);if(e.type==='beast'||e.type==='dasher'){ctx.globalAlpha=.4;ctx.strokeStyle='#ffa58e';ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+e.dir.x*210,e.y+e.dir.y*210);ctx.stroke();ctx.globalAlpha=1}}if(!e.boss){rect(e.x-e.r,e.y-e.r-7,e.r*2,3,'#050b13');rect(e.x-e.r,e.y-e.r-7,e.r*2*clamp(e.hp/e.maxHp,0,1),3,e.elite?'#bda0ff':'#94cdb0')}let j=0;for(const [k,c]of [['burn','#ffb36b'],['freeze','#acf2ff'],['shock','#87aaff'],['bleed','#ff7597']])if(e.status[k]>0)rect(e.x-e.r+(j++)*6,e.y-e.r-14,4,4,c);if(e.elite){circle(e.x,e.y,e.r+3,'#bb95ff',true)}}
 for(const s of shots){circle(s.x,s.y,s.r+1,'#060f1d');circle(s.x,s.y,s.r,s.color);if(s.owner==='player')rect(s.x-1,s.y-1,2,2,'#f0fffa')}
 if(p.inv<=0||Math.floor(clock*20)%2){pixelUnit(p,true);const w=weapons[p.weapon];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.dir.y,p.dir.x));rect(8,-4,21,8,'#0b1624');rect(10,-2,18,4,w.color);ctx.restore()}if(p.shield>0)circle(p.x,p.y,17,'#8bbfffa0',true);if(p.charge>0){ctx.lineWidth=3;circle(p.x,p.y,18+p.charge*10,'#ffe28c',true)}if(has('drone')){rect(p.x+21,p.y-25,9,6,'#a5f5d2');circle(p.x+25,p.y-22,9,'#72f5cf44',true)}
 for(const f of effects){ctx.globalAlpha=clamp(f.t/f.max,0,1);if(f.kind==='text'){ctx.font='bold 12px sans-serif';ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y)}else if(f.kind==='line'){ctx.strokeStyle=f.color;ctx.lineWidth=f.width;ctx.beginPath();ctx.moveTo(f.a.x,f.a.y);ctx.lineTo(f.b.x,f.b.y);ctx.stroke()}else if(f.kind==='ring'){ctx.lineWidth=3;circle(f.x,f.y,f.r*(1-f.t/f.max*.4),f.color,true)}}ctx.globalAlpha=1;for(const t of particles)rect(t.x,t.y,2,2,t.color);ctx.restore();
 if(state==='combat'&&!touchMode){ctx.strokeStyle='#d4ffed';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pointer.x-6,pointer.y);ctx.lineTo(pointer.x+6,pointer.y);ctx.moveTo(pointer.x,pointer.y-6);ctx.lineTo(pointer.x,pointer.y+6);ctx.stroke()}
}
let hudClock=0;
function updateHud(dt){hudClock-=dt;if(hudClock>0||state!=='combat')return;hudClock=.1;$('hpText').textContent=`生命 ${Math.ceil(p.hp)} / ${p.maxHp}${p.shield?' · 护盾 '+Math.ceil(p.shield):''}`;$('hpFill').style.width=(p.hp/p.maxHp*100)+'%';$('weaponText').textContent=`${weapons[p.weapon].name} · 冲刺 ${p.dashCd>0?p.dashCd.toFixed(1)+'s':'就绪'}`;$('objective').innerHTML=`<b>${zones[zone].name}</b><div class="tiny muted">第 ${layer+1}/${STAGES} 段 · ${node.type==='survival'?'守住 '+Math.max(0,Math.ceil(35-roomTime))+'s':node.type==='boss'?'首领战':`波次 ${Math.min(wave,waves)}/${waves}`} · 敌人 ${enemies.length}</div>`;$('runInfo').innerHTML=`${score} 分 · ${coins} 金币<div class="tiny muted">${formatTime(timer)} · ${p.chilled>0?'寒冷减速':combo>1?combo+' 连击':'遗物 '+p.relics.length}</div>`;const boss=enemies.find(e=>e.boss&&!e.dead);$('bossHud').style.display=boss?'block':'none';$('toast').style.bottom=boss?'76px':'16px';if(boss){$('bossName').textContent=boss.name+(boss.phase===2?' · 第二阶段':'');$('bossFill').style.width=Math.max(0,boss.hp/boss.maxHp*100)+'%'}}

function full(){if(document.fullscreenElement)document.exitFullscreen?.();else $('shell').requestFullscreen?.().catch(()=>notify('请使用浏览器菜单全屏，手机建议横屏'))}
function pause(){if(state==='combat')changeState('pause');else if(state==='pause')changeState('combat')}
function doAction(a){if(a==='start')startRun();else if(a==='nextZone')nextZone();else if(a==='leave'&&state==='shop')completeNode();else if(a==='resume')changeState('combat');else if(a==='normal'||a==='relaxed'){difficulty=a;renderScreen()}else changeState(a)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-pick]');if(!target)return;if(target.dataset.pick!==undefined)pickOption(Number(target.dataset.pick));else doAction(target.dataset.action)});
$('soundBtn').onclick=()=>{muted=!muted;$('soundBtn').textContent='声音 '+(muted?'关':'开');if(!muted)sound(500)};$('fullBtn').onclick=full;$('pauseBtn').onclick=pause;
window.addEventListener('keydown',e=>{if(['Space','KeyW','KeyA','KeyS','KeyD','KeyF','Tab'].includes(e.code))e.preventDefault();if(e.repeat)return;keys.add(e.code);if(e.code==='KeyF'){full();return}if(e.code==='Escape'){if(state==='shop')completeNode();else pause();return}if(e.code==='Enter'){if(state==='menu')changeState('loadout');else if(state==='loadout')startRun();else if(state==='areaClear')nextZone();return}const i=/^(Digit|Numpad)[1-8]$/.test(e.code)?Number(e.code.slice(-1))-1:null;if(state==='combat'){if(e.code==='Space')dash();if(e.code==='KeyQ')switchWeapon(p.inventory.indexOf(p.weapon)+1);if(i!==null&&i<p.inventory.length)switchWeapon(i)}else if(i!==null)pickOption(i)});
window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{resetInput();if(state==='combat')changeState('pause')});document.addEventListener('visibilitychange',()=>{if(document.hidden){resetInput();if(state==='combat')changeState('pause');audio?.suspend()}last=0;acc=0});
function point(event){const r=canvas.getBoundingClientRect();return{x:(event.clientX-r.left)/r.width*W,y:(event.clientY-r.top)/r.height*H}}
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')Object.assign(pointer,point(e))});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0&&state==='combat'){Object.assign(pointer,point(e));pointer.fire=true;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointerup',()=>pointer.fire=false);canvas.addEventListener('pointercancel',()=>pointer.fire=false);canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('wheel',e=>{if(state==='combat'){e.preventDefault();switchWeapon(p.inventory.indexOf(p.weapon)+(e.deltaY>0?1:-1))}},{passive:false});
function bindStick(id,isAim){const el=$(id);let active=null;function set(e){const r=el.getBoundingClientRect(),max=r.width*.33;let x=(e.clientX-r.left-r.width/2)/max,y=(e.clientY-r.top-r.height/2)/max;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}if(isAim)aimInput={x,y};else moveInput={x,y};el.style.setProperty('--sx',x*max+'px');el.style.setProperty('--sy',y*max+'px')}el.addEventListener('pointerdown',e=>{if(state!=='combat'||active!==null)return;e.preventDefault();active=e.pointerId;el.setPointerCapture(active);set(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===active)set(e)});for(const type of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(type,e=>{if(e.pointerId!==active)return;active=null;if(isAim)aimInput={x:0,y:0};else moveInput={x:0,y:0};el.style.setProperty('--sx','0px');el.style.setProperty('--sy','0px')})}
bindStick('moveStick',false);bindStick('aimStick',true);$('dashTouch').addEventListener('pointerdown',e=>{e.preventDefault();dash()});$('switchTouch').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='combat')switchWeapon(p.inventory.indexOf(p.weapon)+1)});document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!touchMode){touchMode=true;document.body.classList.add('touch')}});document.body.classList.toggle('touch',touchMode);
// Android 生命周期入口只控制暂停，不获取设备数据。
window.pauseGame=()=>{resetInput();if(state==='combat')changeState('pause')};window.backGame=()=>{if(state==='combat')changeState('pause');else if(state==='pause')changeState('abandon');else if(state!=='menu')changeState('menu')};
function frame(t){if(!last)last=t;const elapsed=Math.min(.1,(t-last)/1000);last=t;acc+=elapsed;let steps=0;while(acc>=1/60&&steps<6){update(1/60);acc-=1/60;steps++}draw();updateHud(elapsed);if(t>toastUntil)$('toast').style.opacity=0;requestAnimationFrame(frame)}
changeState('menu');requestAnimationFrame(frame);
